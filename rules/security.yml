rules:
  # ═══════════════════════════════════════════════════════════════════════════════
  # JAVASCRIPT / TYPESCRIPT
  # ═══════════════════════════════════════════════════════════════════════════════

  # ─── CWE-798: HARDCODED CREDENTIALS ────────────────────────────────────────

  - id: js-known-service-token
    patterns:
      - pattern-either:
          - pattern: const $VAR = "$VAL"
          - pattern: let $VAR = "$VAL"
          - pattern: var $VAR = "$VAL"
          - pattern: $OBJ.$PROP = "$VAL"
      - metavariable-regex:
          metavariable: $VAL
          regex: ^(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|sk-[A-Za-z0-9_\-]{20,}|sk-ant-[A-Za-z0-9_\-]{20,}|sk_live_[A-Za-z0-9]{20,}|sk_test_[A-Za-z0-9]{20,}|pk_live_[A-Za-z0-9]{20,}|pk_test_[A-Za-z0-9]{20,}|rk_live_[A-Za-z0-9]{20,}|rk_test_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|ghs_[A-Za-z0-9]{36}|ghr_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|xox[baprs]-[A-Za-z0-9\-]{10,}|SG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}|AIza[A-Za-z0-9_\-]{35}|ya29\.[A-Za-z0-9_\-]{50,}|EAA[A-Za-z0-9]{60,}|hf_[A-Za-z0-9]{34}|glpat-[A-Za-z0-9_\-]{20,}|npm_[A-Za-z0-9]{36}|pypi-[A-Za-z0-9_\-]{50,}|NRAK-[A-Za-z0-9]{27}|nri-[A-Za-z0-9]{20,}|nriq-[A-Za-z0-9]{20,}|nrjs-[A-Za-z0-9]{20,}|dop_v1_[a-f0-9]{64}|doo_v1_[a-f0-9]{64}|sq0atp-[A-Za-z0-9_\-]{22}|sq0csp-[A-Za-z0-9_\-]{43}|shpat_[a-f0-9]{32}|shpss_[a-f0-9]{32}|shppa_[a-f0-9]{32}|whsec_[A-Za-z0-9]{32,}|AC[a-f0-9]{32}|v2\.[A-Za-z0-9_\-]{40,}|age1[a-z0-9]{58}|op_[A-Za-z0-9_\-]{26,})$
    message: "Token/API key com prefixo conhecido de serviço detectado. Remova imediatamente e use variáveis de ambiente."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      fix: "Use process.env.<VARIABLE_NAME> ou um secret manager."

  - id: js-hex-credential
    patterns:
      - pattern-either:
          - pattern: const $VAR = "$VAL"
          - pattern: let $VAR = "$VAL"
          - pattern: var $VAR = "$VAL"
          - pattern: $OBJ.$PROP = "$VAL"
      - metavariable-regex:
          metavariable: $VAL
          regex: ^[0-9a-fA-F]{32,}$
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)^(?!.*(hash|checksum|sha256|sha512|md5|fingerprint|commit|digest|integrity|etag)).*$
    message: "String hexadecimal longa (32+ chars) hardcoded — padrão de API key/license key. Use variáveis de ambiente."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      fix: "Use process.env.<VARIABLE_NAME> ou um secret manager."

  - id: js-high-entropy-credential
    patterns:
      - pattern-either:
          - pattern: const $VAR = "$VAL"
          - pattern: let $VAR = "$VAL"
          - pattern: var $VAR = "$VAL"
      - metavariable-regex:
          metavariable: $VAL
          regex: ^[A-Za-z0-9+/=_\-]{40,}$
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)^(?!.*(hash|checksum|sha256|sha512|md5|fingerprint|commit|digest|integrity|etag|uuid|encoding|format|regex|pattern|template|placeholder|example|sample|test|mock|dummy|fixture|base64|encoded|cipher|encrypted)).*$
    message: "String de alta entropia (40+ chars) hardcoded — possível credencial exposta."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-798"]
      fix: "Se for um segredo, use process.env.<VARIABLE_NAME> ou um secret manager."

  - id: js-connection-string-credential
    patterns:
      - pattern-either:
          - pattern: const $VAR = "$VAL"
          - pattern: let $VAR = "$VAL"
          - pattern: var $VAR = "$VAL"
          - pattern: $OBJ.$PROP = "$VAL"
      - metavariable-regex:
          metavariable: $VAL
          regex: ^(mongodb(\+srv)?|postgres(ql)?|mysql|mariadb|redis|rediss|amqp|amqps|mssql|jdbc:[a-z]+|sqlserver):\/\/[^\/\s:]+:[^@\s]+@.+
    message: "Connection string com credenciais embutidas detectada. Use variáveis de ambiente."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      fix: "Use process.env.DATABASE_URL ou equivalente."

  - id: js-private-key-pem
    patterns:
      - pattern-either:
          - pattern: const $VAR = "$VAL"
          - pattern: let $VAR = "$VAL"
          - pattern: var $VAR = "$VAL"
      - metavariable-regex:
          metavariable: $VAL
          regex: ^-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----
    message: "Chave privada PEM hardcoded no código-fonte."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      fix: "Armazene chaves privadas em variáveis de ambiente ou secret manager."

  - id: js-hardcoded-jwt
    patterns:
      - pattern-either:
          - pattern: const $VAR = "$VAL"
          - pattern: let $VAR = "$VAL"
          - pattern: var $VAR = "$VAL"
      - metavariable-regex:
          metavariable: $VAL
          regex: ^eyJ[A-Za-z0-9_\-]{20,}\.eyJ[A-Za-z0-9_\-]{20,}\.[A-Za-z0-9_\-]{20,}$
    message: "JWT token hardcoded detectado. Tokens não devem ser armazenados no código-fonte."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      fix: "Use variáveis de ambiente ou obtenha tokens dinamicamente."

  # ─── CWE-89: SQL INJECTION ─────────────────────────────────────────────────

  - id: js-sql-injection-concat
    patterns:
      - pattern-either:
          - pattern: $DB.$METHOD("..." + $VAR + "...")
          - pattern: $DB.$METHOD("..." + $VAR)
          - pattern: $DB.$METHOD($VAR + "...")
          - pattern: |
              $DB.$METHOD(`...${$VAR}...`)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(query|execute|exec|raw|rawQuery|run|all|get|prepare)$
    message: "SQL Injection via concatenação/interpolação. Use prepared statements com placeholders."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      fix: "Use $DB.query('SELECT * FROM t WHERE id = $1', [value])"

  - id: js-sql-injection-orm
    patterns:
      - pattern-either:
          - pattern: |
              $MODEL.findAll({ where: $ORM.literal(`...${$VAR}...`) })
          - pattern: |
              $ORM.query(`...${$VAR}...`)
          - pattern: |
              $ORM.query("..." + $VAR + "...")
          - pattern: |
              $KNEX.raw(`...${$VAR}...`)
          - pattern: |
              $KNEX.raw("..." + $VAR + "...")
    message: "SQL Injection via ORM raw/literal. Use bindings ou replacements."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      fix: "Use $KNEX.raw('SELECT * FROM t WHERE id = ?', [value])"

  - id: js-nosql-injection
    patterns:
      - pattern-either:
          - pattern: |
              $COLL.$METHOD({ ..., $FIELD: $REQ.$PROP, ... })
          - pattern: |
              $COLL.$METHOD({ ..., $FIELD: $REQ.body.$PROP, ... })
          - pattern: |
              $COLL.$METHOD({ ..., $FIELD: $REQ.query.$PROP, ... })
          - pattern: |
              $COLL.$METHOD({ ..., $FIELD: $REQ.params.$PROP, ... })
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(find|findOne|findOneAndUpdate|findOneAndDelete|updateOne|updateMany|deleteOne|deleteMany|aggregate|countDocuments)$
    message: "Possível NoSQL Injection — input do usuário direto em query MongoDB. Valide/sanitize o input."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-943"]
      fix: "Valide o tipo do input (rejeite objetos como {$gt:''}) ou use um schema validator (Joi/Zod)."

  # ─── CWE-78: COMMAND INJECTION ─────────────────────────────────────────────

  - id: js-command-injection-exec
    patterns:
      - pattern-either:
          - pattern: |
              $EXEC(`...${$VAR}...`)
          - pattern: $EXEC("..." + $VAR + "...")
          - pattern: $EXEC("..." + $VAR)
      - metavariable-regex:
          metavariable: $EXEC
          regex: ^(exec|execSync)$
    message: "Command Injection via exec/execSync com interpolação. Use execFile com array de argumentos."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      fix: "Use child_process.execFile(cmd, [arg1, arg2]) em vez de exec com interpolação."

  - id: js-command-injection-spawn-shell
    patterns:
      - pattern-either:
          - pattern: |
              spawn($CMD, $ARGS, { ..., shell: true, ... })
          - pattern: |
              spawnSync($CMD, $ARGS, { ..., shell: true, ... })
    message: "spawn com shell:true é vulnerável a command injection. Remova shell:true."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      fix: "Remova a opção shell:true e passe argumentos como array."

  - id: js-code-injection-eval
    patterns:
      - pattern-either:
          - pattern: eval($VAR)
          - pattern: eval("..." + $VAR + "...")
          - pattern: |
              eval(`...${$VAR}...`)
          - pattern: new Function($VAR)
          - pattern: new Function("..." + $VAR)
          - pattern: |
              new Function(`...${$VAR}...`)
          - pattern: setTimeout($STR, ...)
          - pattern: setInterval($STR, ...)
      - pattern-not: eval("...")
      - pattern-not: setTimeout(..., $NUM)
      - pattern-not: setInterval(..., $NUM)
    message: "Execução dinâmica de código (eval/Function/setTimeout com string). Risco de code injection."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-95"]
      fix: "Evite eval(). Use alternativas seguras como JSON.parse() ou AST parsers."

  # ─── CWE-79: XSS ──────────────────────────────────────────────────────────

  - id: js-xss-dom-manipulation
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $VAR
          - pattern: $EL.innerHTML += $VAR
          - pattern: |
              $EL.innerHTML = `...${$VAR}...`
          - pattern: $EL.outerHTML = $VAR
          - pattern: |
              $EL.outerHTML = `...${$VAR}...`
          - pattern: document.write($VAR)
          - pattern: document.write("..." + $VAR + "...")
          - pattern: |
              document.write(`...${$VAR}...`)
          - pattern: document.writeln($VAR)
          - pattern: $EL.insertAdjacentHTML($POS, $VAR)
          - pattern: |
              $EL.insertAdjacentHTML($POS, `...${$VAR}...`)
    message: "XSS via manipulação insegura do DOM. Use textContent ou DOMPurify.sanitize()."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-79"]
      fix: "Use element.textContent = value ou DOMPurify.sanitize(value)."

  - id: js-xss-react-dangerously
    pattern: |
      <$EL dangerouslySetInnerHTML={$VAR} />
    message: "XSS via React dangerouslySetInnerHTML. Sanitize com DOMPurify antes de usar."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-79"]
      fix: "Use DOMPurify.sanitize(value) antes de dangerouslySetInnerHTML."

  - id: js-xss-jquery
    patterns:
      - pattern-either:
          - pattern: $($SEL).html($VAR)
          - pattern: $($SEL).append($VAR)
          - pattern: $($SEL).prepend($VAR)
          - pattern: $($SEL).after($VAR)
          - pattern: $($SEL).before($VAR)
      - pattern-not: $($SEL).html("...")
    message: "XSS via jQuery DOM manipulation. Sanitize o input ou use .text()."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-79"]

  # ─── CWE-22: PATH TRAVERSAL ────────────────────────────────────────────────

  - id: js-path-traversal
    patterns:
      - pattern-either:
          - pattern: path.join($BASE, $REQ.$PROP)
          - pattern: path.join($BASE, $REQ.params.$P)
          - pattern: path.join($BASE, $REQ.query.$P)
          - pattern: path.join($BASE, $REQ.body.$P)
          - pattern: path.resolve($BASE, $REQ.$PROP)
          - pattern: fs.readFile($REQ.$PROP, ...)
          - pattern: fs.readFileSync($REQ.$PROP, ...)
          - pattern: |
              fs.readFile(`...${$REQ.$PROP}...`, ...)
          - pattern: |
              fs.readFileSync(`...${$REQ.$PROP}...`, ...)
    message: "Path Traversal — input do usuário em caminho de arquivo. Valide e canonicalize o path."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-22"]
      fix: "Use path.normalize() e verifique se o resultado está dentro do diretório base."

  # ─── CWE-918: SSRF ─────────────────────────────────────────────────────────

  - id: js-ssrf
    patterns:
      - pattern-either:
          - pattern: fetch($REQ.$PROP)
          - pattern: fetch($REQ.query.$P)
          - pattern: fetch($REQ.body.$P)
          - pattern: |
              fetch(`...${$VAR}...`)
          - pattern: axios.get($REQ.$PROP)
          - pattern: axios.get($REQ.query.$P)
          - pattern: axios.get($REQ.body.$P)
          - pattern: |
              axios.get(`...${$VAR}...`)
          - pattern: |
              axios.post(`...${$VAR}...`, ...)
          - pattern: |
              axios({ url: `...${$VAR}...`, ... })
          - pattern: http.get($REQ.$PROP, ...)
          - pattern: |
              http.get(`...${$VAR}...`, ...)
          - pattern: |
              http.request({ ..., host: $VAR, ... })
          - pattern: https.get($REQ.$PROP, ...)
      - pattern-not: fetch("...")
      - pattern-not: axios.get("...")
    message: "Possível SSRF — URL dinâmica em requisição server-side. Valide contra allowlist."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-918"]
      fix: "Valide a URL contra uma allowlist. Bloqueie IPs internos (127.0.0.1, 10.x, 172.16.x, 192.168.x)."

  # ─── CWE-327: WEAK CRYPTOGRAPHY ────────────────────────────────────────────

  - id: js-weak-crypto-hash
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("$ALG")
      - metavariable-regex:
          metavariable: $ALG
          regex: ^(md4|md5|sha1|ripemd160)$
    message: "Hash criptográfico fraco. Use SHA-256+ para integridade ou bcrypt/argon2 para senhas."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-327"]
      fix: "Use crypto.createHash('sha256') ou bcrypt/argon2id para senhas."

  - id: js-weak-crypto-cipher
    patterns:
      - pattern-either:
          - pattern: crypto.createCipher("$ALG", ...)
          - pattern: crypto.createCipheriv("$ALG", ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: ^(des|des-ede|des-ede3|rc4|rc2|blowfish|aes-128-ecb|aes-192-ecb|aes-256-ecb)$
    message: "Algoritmo de criptografia fraco/inseguro. Use AES-256-GCM."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-327"]
      fix: "Use crypto.createCipheriv('aes-256-gcm', key, iv) com IV aleatório."

  - id: js-weak-random
    pattern: Math.random()
    message: "Math.random() não é criptograficamente seguro. Use crypto.randomBytes() ou crypto.randomUUID()."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-338"]
      fix: "Use crypto.randomBytes(32) ou crypto.randomUUID() para valores sensíveis."

  # ─── CWE-502: INSECURE DESERIALIZATION ──────────────────────────────────────

  - id: js-insecure-deserialization
    patterns:
      - pattern-either:
          - pattern: serialize.unserialize($VAR)
          - pattern: node_serialize.unserialize($VAR)
          - pattern: $YAML.load($VAR)
      - pattern-not: $YAML.safeLoad($VAR)
    message: "Desserialização insegura. Valide com schema antes de processar."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-502"]
      fix: "Valide o input com um schema (Joi, Zod, ajv) antes de desserializar."

  # ─── CWE-922: INSECURE STORAGE ─────────────────────────────────────────────

  - id: js-sensitive-data-storage
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem("$KEY", ...)
          - pattern: sessionStorage.setItem("$KEY", ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(token|access_token|jwt|refresh_token|session|auth|api_key|password|secret|credential)$
    message: "Dados sensíveis em localStorage/sessionStorage (acessível via XSS). Use httpOnly cookies."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-922"]
      fix: "Use cookies httpOnly + Secure + SameSite para tokens de autenticação."

  # ─── CWE-601: OPEN REDIRECT ────────────────────────────────────────────────

  - id: js-open-redirect
    patterns:
      - pattern-either:
          - pattern: $RES.redirect($REQ.query.$P)
          - pattern: $RES.redirect($REQ.params.$P)
          - pattern: $RES.redirect($REQ.body.$P)
          - pattern: |
              $RES.redirect(`...${$REQ.query.$P}...`)
          - pattern: window.location = $VAR
          - pattern: window.location.href = $VAR
          - pattern: window.location.assign($VAR)
          - pattern: window.location.replace($VAR)
      - pattern-not: $RES.redirect("...")
      - pattern-not: window.location = "..."
      - pattern-not: window.location.href = "..."
    message: "Open Redirect — redirecionamento com input do usuário. Valide contra allowlist."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-601"]
      fix: "Valide que a URL pertence ao mesmo domínio ou está em uma allowlist."

  # ─── CWE-1004/614: INSECURE COOKIES ────────────────────────────────────────

  - id: js-cookie-insecure
    patterns:
      - pattern-either:
          - pattern: |
              $RES.cookie($NAME, $VAL, { ..., httpOnly: false, ... })
          - pattern: |
              $RES.cookie($NAME, $VAL, { ..., secure: false, ... })
    message: "Cookie sem httpOnly ou secure. Adicione httpOnly:true e secure:true."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-1004", "CWE-614"]

  # ─── CWE-1333: ReDoS ───────────────────────────────────────────────────────

  - id: js-regex-dos
    patterns:
      - pattern-either:
          - pattern: new RegExp($REQ.$PROP)
          - pattern: new RegExp($REQ.query.$P)
          - pattern: new RegExp($REQ.body.$P)
          - pattern: new RegExp($REQ.params.$P)
    message: "ReDoS — regex construída com input do usuário. Use uma lib segura como re2."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-1333"]
      fix: "Use a biblioteca 're2' ou valide/escape o input antes."

  # ─── CWE-209: ERROR INFORMATION LEAK ───────────────────────────────────────

  - id: js-error-info-leak
    patterns:
      - pattern-either:
          - pattern: $RES.send($ERR.stack)
          - pattern: |
              $RES.json({ ..., stack: $ERR.stack, ... })
          - pattern: $RES.status(...).send($ERR.stack)
          - pattern: |
              $RES.status(...).json({ ..., stack: $ERR.stack, ... })
    message: "Stack trace exposto ao cliente. Use mensagens genéricas em produção."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-209"]
      fix: "Logue o erro internamente e retorne uma mensagem genérica ao usuário."

  # ─── CWE-295/319: INSECURE TRANSPORT ───────────────────────────────────────

  - id: js-tls-disabled
    patterns:
      - pattern-either:
          - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
          - pattern: |
              { ..., rejectUnauthorized: false, ... }
    message: "Verificação TLS desabilitada. Risco de man-in-the-middle."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-295"]
      fix: "Remova rejectUnauthorized: false. Use certificados válidos."

  - id: js-insecure-http-url
    patterns:
      - pattern-either:
          - pattern: fetch("$URL")
          - pattern: axios.get("$URL")
          - pattern: axios.post("$URL", ...)
      - metavariable-regex:
          metavariable: $URL
          regex: ^http:\/\/(?!localhost|127\.0\.0\.1|0\.0\.0\.0).+
    message: "URL HTTP sem criptografia. Use HTTPS."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-319"]
      fix: "Substitua http:// por https://."

  # ─── CWE-639: IDOR ─────────────────────────────────────────────────────────

  - id: js-idor
    patterns:
      - pattern-either:
          - pattern: |
              $MODEL.$METHOD({ ..., id: $REQ.params.$P, ... })
          - pattern: |
              $MODEL.$METHOD({ ..., _id: $REQ.params.$P, ... })
          - pattern: $MODEL.findById($REQ.params.$P)
          - pattern: $MODEL.findByPk($REQ.params.$P)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(findOne|findOneAndUpdate|findOneAndDelete|deleteOne|updateOne)$
    message: "Possível IDOR — acesso direto por ID sem verificação de ownership."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-639"]
      fix: "Adicione verificação de ownership: inclua o userId autenticado na query."

  # ─── CWE-1321: PROTOTYPE POLLUTION ─────────────────────────────────────────

  - id: js-prototype-pollution
    patterns:
      - pattern-either:
          - pattern: Object.assign($TARGET, $REQ.body)
          - pattern: Object.assign($TARGET, $REQ.$PROP)
          - pattern: "{ ...$TARGET, ...$REQ.body }"
    message: "Prototype Pollution via merge de objeto com input do usuário."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-1321"]
      fix: "Use uma lib com proteção ou valide as keys antes do merge."

  # ─── CWE-94: UNSAFE REQUIRE/IMPORT ─────────────────────────────────────────

  - id: js-unsafe-dynamic-import
    patterns:
      - pattern-either:
          - pattern: require($VAR)
          - pattern: |
              require(`...${$VAR}...`)
          - pattern: import($VAR)
          - pattern: |
              import(`...${$VAR}...`)
      - pattern-not: require("...")
      - pattern-not: import("...")
    message: "Import/require dinâmico com variável. Risco de code injection via path manipulation."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-94"]
      fix: "Use imports estáticos ou valide contra uma allowlist de módulos."

  # ─── JWT SECURITY ──────────────────────────────────────────────────────────

  - id: js-jwt-no-verify
    patterns:
      - pattern-either:
          - pattern: jwt.decode($TOKEN)
          - pattern: jwt.decode($TOKEN, ...)
          - pattern: $JWT.decode($TOKEN)
      - pattern-not-inside: |
          jwt.verify(...)
          ...
