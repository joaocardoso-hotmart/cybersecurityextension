        ...
      }
    message: "RDS publicly_accessible=true expõe banco à internet. Use subnets privadas."
    languages: [hcl]
    severity: ERROR
    metadata:
      cwe: ["CWE-284"]

  - id: tf-rds-no-encryption
    pattern: |
      resource "aws_db_instance" $NAME {
        ...
        storage_encrypted = false
        ...
      }
    message: "RDS storage_encrypted=false. Habilite encryption-at-rest."
    languages: [hcl]
    severity: WARNING
    metadata:
      cwe: ["CWE-311"]

  - id: tf-s3-no-encryption
    pattern: |
      resource "aws_s3_bucket" $NAME {
        ...
      }
    message: "Bucket S3 sem server_side_encryption_configuration. Habilite SSE-S3 ou SSE-KMS."
    languages: [hcl]
    severity: INFO
    metadata:
      cwe: ["CWE-311"]

  - id: tf-hardcoded-secret
    patterns:
      - pattern-either:
          - pattern: $KEY = "$VAL"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(password|passwd|secret|api_key|access_key|secret_key|private_key|token|aws_access_key_id|aws_secret_access_key)$
      - metavariable-regex:
          metavariable: $VAL
          regex: ^[A-Za-z0-9_\-/+=]{8,}$
    message: "Credencial hardcoded em Terraform. Use variáveis (var.) ou data source de secret manager."
    languages: [hcl]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]

  - id: tf-iam-policy-wildcard
    patterns:
      - pattern-either:
          - pattern: |
              {
                "Effect": "Allow",
                "Action": "*",
                "Resource": "*"
              }
          - pattern: |
              {
                "Effect": "Allow",
                "Action": ["*"],
                "Resource": ["*"]
              }
    message: "Policy IAM com Action:* e Resource:* concede privilégios totais. Aplique princípio do menor privilégio."
    languages: [json]
    severity: ERROR
    metadata:
      cwe: ["CWE-732"]

  # ═══════════════════════════════════════════════════════════════════════════════
  #                          YAML / JSON / DOCKERFILE (genéricos)
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: yaml-hardcoded-secret
    patterns:
      - pattern-regex: (?i)^\s*(password|passwd|secret|api[_-]?key|access[_-]?key|secret[_-]?key|private[_-]?key|token|aws[_-]?(access|secret)[_-]?key|jwt[_-]?secret|client[_-]?secret|db[_-]?password|senha|chave[_-]?secreta)\s*:\s*["']?[A-Za-z0-9_\-/+=]{8,}["']?\s*$
      - pattern-not-regex: (?i):\s*["']?(\{\{.*\}\}|\$\{.*\}|<.*>|changeme|example|your.*here|placeholder|todo|fixme|null|~|true|false)["']?\s*$
    message: "Possível credencial hardcoded em arquivo YAML. Use referências a secret manager ou variáveis."
    languages: [yaml]
    severity: WARNING
    metadata:
      cwe: ["CWE-798"]

  - id: json-hardcoded-secret
    patterns:
      - pattern-regex: (?i)"(password|passwd|secret|api[_-]?key|access[_-]?key|secret[_-]?key|private[_-]?key|token|aws[_-]?(access|secret)[_-]?key|jwt[_-]?secret|client[_-]?secret|db[_-]?password|senha|chave[_-]?secreta)"\s*:\s*"[A-Za-z0-9_\-/+=]{8,}"
      - pattern-not-regex: (?i):\s*"(\{\{.*\}\}|\$\{.*\}|<.*>|changeme|example|your.*here|placeholder|todo|fixme)"
    message: "Possível credencial hardcoded em arquivo JSON. Use variáveis de ambiente ou secret manager."
    languages: [json]
    severity: WARNING
    metadata:
      cwe: ["CWE-798"]

  - id: yaml-aws-key
    pattern-regex: \bAKIA[0-9A-Z]{16}\b
    message: "AWS Access Key ID hardcoded em YAML. Remova imediatamente e rotacione a chave."
    languages: [yaml]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]

  - id: json-aws-key
    pattern-regex: \bAKIA[0-9A-Z]{16}\b
    message: "AWS Access Key ID hardcoded em JSON. Remova imediatamente e rotacione a chave."
    languages: [json]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]

  - id: dockerfile-run-as-root
    patterns:
      - pattern-regex: (?im)^(RUN|CMD|ENTRYPOINT)\s+
      - pattern-not-regex: (?im)^USER\s+(?!root\b)\S+
    message: "Dockerfile sem instrução USER não-root. Adicione 'USER <nonroot>' antes das instruções de execução para reduzir privilégios."
    languages: [generic]
    paths:
      include:
        - "*Dockerfile*"
    severity: INFO
    metadata:
      cwe: ["CWE-250"]

  # ═══════════════════════════════════════════════════════════════════════════════
  # PYTHON: CWE-502: INSECURE DESERIALIZATION
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: python-pickle-loads
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: _pickle.loads(...)
          - pattern: cPickle.loads(...)
          - pattern: cPickle.load(...)
          - pattern: shelve.open(...)
    message: "Desserialização insegura com pickle. Nunca use pickle com dados não confiáveis — permite execução remota de código (RCE)."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-502"]
      owasp: ["A08:2021"]
      fix: "Use json.loads() ou msgpack para deserialização segura. Se pickle for necessário, use hmac para verificar integridade."

  - id: python-yaml-unsafe-load
    patterns:
      - pattern-either:
          - pattern: yaml.load($DATA)
          - pattern: yaml.load($DATA, ...)
      - pattern-not: yaml.load($DATA, Loader=yaml.SafeLoader)
      - pattern-not: yaml.load($DATA, Loader=yaml.CSafeLoader)
    message: "yaml.load() sem SafeLoader permite execução de código arbitrário. Use yaml.safe_load()."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-502"]
      fix: "Use yaml.safe_load() ou yaml.load(data, Loader=yaml.SafeLoader)."

  - id: python-marshal-loads
    patterns:
      - pattern-either:
          - pattern: marshal.loads(...)
          - pattern: marshal.load(...)
    message: "marshal.loads() com dados não confiáveis permite execução de código."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-502"]

  # ═══════════════════════════════════════════════════════════════════════════════
  # PYTHON: CWE-78: COMMAND INJECTION
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: python-os-system
    patterns:
      - pattern-either:
          - pattern: os.system(...)
          - pattern: os.popen(...)
    message: "os.system()/os.popen() são vulneráveis a command injection. Use subprocess com shell=False."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      fix: "Use subprocess.run([cmd, arg1, arg2], shell=False)."

  - id: python-subprocess-shell-true
    patterns:
      - pattern-either:
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
    message: "subprocess com shell=True é vulnerável a command injection. Use shell=False com lista de argumentos."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      fix: "Use subprocess.run([cmd, arg1], shell=False)."

  - id: python-eval-exec
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
          - pattern: compile($SRC, ...)
    message: "eval()/exec() com dados não confiáveis permite execução de código arbitrário."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-95"]
      fix: "Evite eval/exec. Use ast.literal_eval() para avaliar literais Python de forma segura."

  # ═══════════════════════════════════════════════════════════════════════════════
  # PYTHON: CWE-89: SQL INJECTION
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: python-sql-injection-format
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute("..." % $VAR)
          - pattern: $CURSOR.execute(f"...{$VAR}...")
          - pattern: $CURSOR.execute("...".format(...))
          - pattern: $CURSOR.execute("..." + $VAR + "...")
          - pattern: $CURSOR.execute("..." + $VAR)
          - pattern: $DB.execute("..." % $VAR)
          - pattern: $DB.execute(f"...{$VAR}...")
          - pattern: $DB.execute("...".format(...))
    message: "SQL Injection via formatação de string. Use parameterized queries."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      fix: "Use cursor.execute('SELECT * FROM users WHERE id = %s', (user_id,))."

  # ═══════════════════════════════════════════════════════════════════════════════
  # PYTHON: CWE-798: HARDCODED CREDENTIALS
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: python-hardcoded-secret
    patterns:
      - pattern-either:
          - pattern: $VAR = "..."
          - pattern: $VAR = '...'
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|pwd|secret|api_key|apikey|token|private_key|access_key|secret_key|db_password|auth_token|senha|chave|credential)
    message: "Credencial hardcoded detectada. Use variáveis de ambiente ou secret manager."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      fix: "Use os.environ.get('VARIABLE_NAME') ou um secret manager."

  - id: python-aws-key
    patterns:
      - pattern-either:
          - pattern: $VAR = "..."
          - pattern: $VAR = '...'
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(aws_access_key|aws_secret|aws_key)
    message: "AWS credentials hardcoded. Use IAM roles ou variáveis de ambiente."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]

  # ═══════════════════════════════════════════════════════════════════════════════
  # PYTHON: CWE-22: PATH TRAVERSAL
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: python-path-traversal
    patterns:
      - pattern-either:
          - pattern: open(request.$PROP, ...)
          - pattern: open(f"...{request.$PROP}...", ...)
          - pattern: open(os.path.join($BASE, request.$PROP), ...)
    message: "Path Traversal: abertura de arquivo com input do usuário. Valide o caminho."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-22"]
      fix: "Use os.path.realpath() e valide que o resultado está dentro do diretório base."

  # ═══════════════════════════════════════════════════════════════════════════════
  # PYTHON: CWE-918: SSRF
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: python-ssrf-requests
    patterns:
      - pattern-either:
          - pattern: requests.get(request.$PROP, ...)
          - pattern: requests.post(request.$PROP, ...)
          - pattern: requests.get(f"...{$VAR}...", ...)
          - pattern: requests.post(f"...{$VAR}...", ...)
          - pattern: urllib.request.urlopen(request.$PROP)
          - pattern: urllib.request.urlopen(f"...{$VAR}...")
    message: "Possível SSRF. Valide e restrinja URLs antes de fazer requisições server-side."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-918"]
      fix: "Valide a URL contra uma allowlist. Bloqueie IPs internos e metadata endpoints."

  # ═══════════════════════════════════════════════════════════════════════════════
  # PYTHON: CWE-327: WEAK CRYPTOGRAPHY
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: python-weak-hash
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)
    message: "Hash criptográfico fraco (MD5/SHA1). Use SHA-256+ para integridade ou bcrypt/argon2 para senhas."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: ["CWE-327"]
      fix: "Use hashlib.sha256() para integridade ou bcrypt/argon2id para senhas."

  # ═══════════════════════════════════════════════════════════════════════════════
  # PYTHON: CWE-295: DISABLED TLS VERIFICATION
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: python-tls-disabled
    patterns:
      - pattern-either:
          - pattern: requests.get(..., verify=False, ...)
          - pattern: requests.post(..., verify=False, ...)
          - pattern: requests.put(..., verify=False, ...)
          - pattern: requests.delete(..., verify=False, ...)
          - pattern: requests.patch(..., verify=False, ...)
          - pattern: urllib3.disable_warnings(...)
    message: "Verificação TLS desabilitada. Isso permite ataques man-in-the-middle."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-295"]
      fix: "Remova verify=False. Use certificados válidos."

  # ═══════════════════════════════════════════════════════════════════════════════
  # PYTHON: CWE-209: ERROR INFO LEAK
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: python-flask-debug
    patterns:
      - pattern-either:
          - pattern: app.run(..., debug=True, ...)
          - pattern: app.config["DEBUG"] = True
    message: "Flask em modo debug expõe stack traces e permite execução de código no debugger."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-209"]
      fix: "Use debug=False em produção. Configure via variável de ambiente."

  - id: python-traceback-response
    patterns:
      - pattern-either:
          - pattern: traceback.format_exc()
          - pattern: traceback.print_exc()
    message: "Stack trace pode ser exposto ao cliente. Retorne mensagens genéricas de erro."
    languages: [python]
    severity: WARNING
    metadata:
      cwe: ["CWE-209"]
      fix: "Logue o traceback internamente e retorne uma mensagem genérica ao usuário."

  # ═══════════════════════════════════════════════════════════════════════════════
  # JAVA/KOTLIN: CWE-502: INSECURE DESERIALIZATION
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: java-unsafe-deserialization
    patterns:
      - pattern-either:
          - pattern: new ObjectInputStream(...)
          - pattern: $OIS.readObject()
          - pattern: $OIS.readUnshared()
    message: "Desserialização Java insegura. ObjectInputStream com dados não confiáveis permite RCE."
    languages: [java, kotlin]
    severity: ERROR
    metadata:
      cwe: ["CWE-502"]
      owasp: ["A08:2021"]
      fix: "Use ObjectInputFilter (Java 9+) ou valide tipos permitidos. Prefira JSON/protobuf."

  - id: java-xmldecoder
    patterns:
      - pattern-either:
          - pattern: new XMLDecoder(...)
          - pattern: $DEC.readObject()
    message: "XMLDecoder permite execução de código arbitrário. Não use com dados não confiáveis."
    languages: [java, kotlin]
    severity: ERROR
    metadata:
      cwe: ["CWE-502"]

  # ═══════════════════════════════════════════════════════════════════════════════
  # JAVA/KOTLIN: CWE-89: SQL INJECTION
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: java-sql-injection-concat
    patterns:
      - pattern-either:
          - pattern: $STMT.executeQuery("..." + $VAR + "...")
          - pattern: $STMT.executeQuery("..." + $VAR)
          - pattern: $STMT.execute("..." + $VAR + "...")
          - pattern: $STMT.executeUpdate("..." + $VAR + "...")
          - pattern: $CONN.createStatement().executeQuery("..." + $VAR + "...")
    message: "SQL Injection via concatenação. Use PreparedStatement com parâmetros."
    languages: [java, kotlin]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      owasp: ["A03:2021"]
      fix: "Use PreparedStatement: pstmt.setString(1, value)."

  - id: java-sql-injection-string-format
    patterns:
      - pattern-either:
          - pattern: |
              $STMT.executeQuery(String.format("...", $VAR))
          - pattern: |
              $EM.createQuery("..." + $VAR + "...")
          - pattern: |
              $EM.createNativeQuery("..." + $VAR + "...")
    message: "SQL Injection via String.format/concatenação em JPA. Use parameterized queries."
    languages: [java, kotlin]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      fix: "Use @Query com :param ou TypedQuery com setParameter()."

  # ═══════════════════════════════════════════════════════════════════════════════
  # JAVA/KOTLIN: CWE-78: COMMAND INJECTION
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: java-command-injection
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($CMD)
          - pattern: Runtime.getRuntime().exec("..." + $VAR + "...")
          - pattern: Runtime.getRuntime().exec("..." + $VAR)
          - pattern: new ProcessBuilder("bash", "-c", $VAR)
          - pattern: new ProcessBuilder("sh", "-c", $VAR)
          - pattern: new ProcessBuilder("cmd", "/c", $VAR)
    message: "Command Injection. Não passe input do usuário para exec(). Use ProcessBuilder com lista de argumentos."
    languages: [java, kotlin]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      fix: "Use new ProcessBuilder(List.of(cmd, arg1, arg2)) sem shell wrapper."

  # ═══════════════════════════════════════════════════════════════════════════════
  # JAVA/KOTLIN: CWE-798: HARDCODED CREDENTIALS
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: java-hardcoded-secret
    patterns:
      - pattern-either:
          - pattern: String $VAR = "..."
          - pattern: val $VAR = "..."
          - pattern: var $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|secret|api_key|apiKey|token|privateKey|private_key|accessKey|access_key|secretKey|dbPassword|authToken|senha|credential)
    message: "Credencial hardcoded. Use variáveis de ambiente ou secret manager."
    languages: [java, kotlin]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      fix: "Use System.getenv(\"VARIABLE\") ou Spring @Value(\"${secret}\") com Vault."

  # ═══════════════════════════════════════════════════════════════════════════════
  # JAVA/KOTLIN: CWE-327: WEAK CRYPTOGRAPHY
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: java-weak-hash
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("MD5")
          - pattern: MessageDigest.getInstance("SHA-1")
          - pattern: MessageDigest.getInstance("SHA1")
          - pattern: DigestUtils.md5(...)
          - pattern: DigestUtils.md5Hex(...)
          - pattern: DigestUtils.sha1(...)
          - pattern: DigestUtils.sha1Hex(...)
    message: "Hash criptográfico fraco (MD5/SHA1). Use SHA-256+ para integridade ou BCrypt/Argon2 para senhas."
    languages: [java, kotlin]
    severity: WARNING
    metadata:
      cwe: ["CWE-327"]
      fix: "Use MessageDigest.getInstance(\"SHA-256\") ou BCryptPasswordEncoder."

  - id: java-weak-cipher
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance("DES")
          - pattern: Cipher.getInstance("DES/...")
          - pattern: Cipher.getInstance("DESede/ECB/...")
          - pattern: Cipher.getInstance("AES/ECB/...")
          - pattern: Cipher.getInstance("RC4")
          - pattern: Cipher.getInstance("Blowfish")
    message: "Algoritmo de criptografia fraco/inseguro. Use AES/GCM/NoPadding."
    languages: [java, kotlin]
    severity: ERROR
    metadata:
      cwe: ["CWE-327"]
      fix: "Use Cipher.getInstance(\"AES/GCM/NoPadding\") com chave de 256 bits."

  # ═══════════════════════════════════════════════════════════════════════════════
  # JAVA/KOTLIN: CWE-918: SSRF
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: java-ssrf
    patterns:
      - pattern-either:
          - pattern: new URL($VAR).openConnection()
          - pattern: new URL($VAR).openStream()
          - pattern: HttpClient.newHttpClient().send(HttpRequest.newBuilder().uri(URI.create($VAR)).build(), ...)
    message: "Possível SSRF. Valide a URL contra uma allowlist antes de fazer requisições."
    languages: [java, kotlin]
    severity: ERROR
    metadata:
      cwe: ["CWE-918"]
      fix: "Valide domínio contra allowlist. Bloqueie IPs internos e metadata endpoints."

  # ═══════════════════════════════════════════════════════════════════════════════
  # JAVA/KOTLIN: CWE-22: PATH TRAVERSAL
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: java-path-traversal
    patterns:
      - pattern-either:
          - pattern: new File($BASE + $VAR)
          - pattern: new File($BASE, $VAR)
          - pattern: Paths.get($BASE, $VAR)
          - pattern: new FileInputStream($VAR)
    message: "Possível Path Traversal. Canonicalize e valide o caminho contra diretório base."
    languages: [java, kotlin]
    severity: WARNING
    metadata:
      cwe: ["CWE-22"]
      fix: "Use Path.normalize().toRealPath() e verifique startsWith(baseDir)."

  # ═══════════════════════════════════════════════════════════════════════════════
  # JAVA/KOTLIN: CWE-295: DISABLED TLS
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: java-tls-disabled
    patterns:
      - pattern-either:
          - pattern: |
              new X509TrustManager() { ... }
          - pattern: |
              SSLContext.getInstance("SSL")
          - pattern: |
              $BUILDER.hostnameVerifier(($H, $S) -> true)
          - pattern: |
              .hostnameVerifier((hostname, session) -> true)
    message: "Verificação TLS/SSL desabilitada. Isso permite ataques man-in-the-middle."
    languages: [java, kotlin]
    severity: ERROR
    metadata:
      cwe: ["CWE-295"]
      fix: "Use TLS padrão com certificados válidos. Nunca desabilite hostname verification."

  # ═══════════════════════════════════════════════════════════════════════════════
  # JAVA/KOTLIN: CWE-79: XSS (Spring MVC)
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: java-spring-xss
    patterns:
      - pattern-either:
          - pattern: |
              @ResponseBody
              ...
              return $VAR;
    message: "Verifique se dados do usuário estão sendo escapados antes de retornar na resposta."
    languages: [java, kotlin]
    severity: INFO
    metadata:
      cwe: ["CWE-79"]

  # ═══════════════════════════════════════════════════════════════════════════════
  # JAVA/KOTLIN: CWE-209: ERROR INFO LEAK
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: java-stacktrace-response
    patterns:
      - pattern-either:
          - pattern: $EX.printStackTrace()
          - pattern: $EX.getStackTrace()
    message: "Stack trace pode ser exposto ao cliente. Use logging interno e mensagens genéricas."
    languages: [java, kotlin]
    severity: WARNING
    metadata:
      cwe: ["CWE-209"]
