  - id: scala-sql-injection
    patterns:
      - pattern-either:
          - pattern: |
              $STMT.executeQuery(s"...$${$VAR}...")
          - pattern: |
              $STMT.executeQuery("..." + $VAR + "...")
          - pattern: |
              $DB.run(sql"...#$${$VAR}...")
    message: "SQL Injection via interpolação. Use parameterized queries."
