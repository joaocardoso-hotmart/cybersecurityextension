  # PYTHON RULES — SQL Injection, Hardcoded Credentials
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: python-sql-injection-format
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute(f"...{$VAR}...")
          - pattern: $CURSOR.execute("..." + $VAR + "...")
          - pattern: $CURSOR.execute("...%s..." % $VAR)
          - pattern: $CURSOR.execute("...{}...".format($VAR))
    message: "SQL Injection em Python. Use parameterized queries."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      fix: "Use cursor.execute('SELECT * FROM users WHERE id = %s', (user_id,))"

  - id: python-hardcoded-secret
    patterns:
      - pattern-either:
          - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|passwd|secret|api_key|token|private_key|db_password|db_pass|access_key|secret_key)
    message: "Credencial hardcoded em Python. Use variáveis de ambiente."
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      fix: "Use os.environ.get('SECRET_NAME') ou um secret manager."

