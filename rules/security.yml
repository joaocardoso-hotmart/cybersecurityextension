    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      fix: "Use prepared statements ou Slick sql interpolator com parâmetros tipados."

  # ═══════════════════════════════════════════════════════════════════════════════
  # SCALA: CWE-502: INSECURE DESERIALIZATION
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: scala-unsafe-deserialization
    patterns:
