  # ═══════════════════════════════════════════════════════════════════════════════
  # TERRAFORM: CWE-284: INSECURE INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: terraform-open-security-group
    patterns:
      - pattern-either:
          - pattern: |
              cidr_blocks = ["0.0.0.0/0"]
          - pattern: |
              ipv6_cidr_blocks = ["::/0"]
    message: "Security Group aberto para todo mundo (0.0.0.0/0). Restrinja para IPs específicos."
    languages: [hcl]
    severity: ERROR
    metadata:
      cwe: ["CWE-284"]
      fix: "Restrinja cidr_blocks para ranges específicos da sua organização."

  - id: terraform-public-s3
    patterns:
      - pattern-either:
          - pattern: acl = "public-read"
          - pattern: acl = "public-read-write"
    message: "S3 bucket com ACL pública. Dados podem ser acessados por qualquer pessoa."
    languages: [hcl]
    severity: ERROR
    metadata:
      cwe: ["CWE-284"]
      fix: "Use acl = \"private\" e configure bucket policies específicas."

  - id: terraform-unencrypted-storage
    patterns:
      - pattern-either:
          - pattern: encrypted = false
          - pattern: |
              server_side_encryption_configuration { ... }
    message: "Storage sem criptografia. Habilite encryption at rest."
    languages: [hcl]
    severity: ERROR
    metadata:
      cwe: ["CWE-311"]
      fix: "Use encrypted = true e configure KMS key."

  - id: terraform-wildcard-iam
    patterns:
      - pattern-either:
          - pattern: actions = ["*"]
          - pattern: resources = ["*"]
          - pattern: |
              effect = "Allow"
              ...
              actions = ["*"]
    message: "IAM policy com wildcard (*). Viola princípio de least privilege."
    languages: [hcl]
    severity: ERROR
    metadata:
      cwe: ["CWE-250"]
      fix: "Especifique apenas as actions e resources necessários."

  - id: terraform-hardcoded-secret
    patterns:
      - pattern-either:
          - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|secret|api_key|access_key|private_key|token|credential)
    message: "Credencial hardcoded no Terraform. Use variáveis com sensitive=true ou Vault."
    languages: [hcl]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      fix: "Use variable com sensitive=true e forneça via terraform.tfvars ou Vault."

  - id: terraform-public-db
    patterns:
      - pattern-either:
          - pattern: publicly_accessible = true
    message: "Database com acesso público. Coloque em subnet privada."
    languages: [hcl]
    severity: ERROR
    metadata:
      cwe: ["CWE-284"]
      fix: "Use publicly_accessible = false e acesse via VPN/bastion."

  - id: terraform-no-logging
    patterns:
      - pattern-either:
          - pattern: enable_logging = false
          - pattern: logging_enabled = false
    message: "Logging desabilitado. Habilite para auditoria e detecção de incidentes."
    languages: [hcl]
    severity: WARNING
    metadata:
      cwe: ["CWE-778"]
      fix: "Habilite logging/audit trails para compliance e detecção de incidentes."

  # ═══════════════════════════════════════════════════════════════════════════════
  # PHP RULES — SQL Injection, Hardcoded Credentials, Command Injection
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: php-sql-injection-variable-in-query
    patterns:
      - pattern: $CONN->query("...$VAR...")
    message: "SQL Injection em PHP. Use prepared statements com bind_param()."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      fix: "Use $stmt = $conn->prepare('SELECT * FROM users WHERE username = ?'); $stmt->bind_param('s', $username);"

  - id: php-sql-injection-concat
    patterns:
      - pattern-either:
          - pattern: $CONN->query("..." . $VAR . "...")
          - pattern: $CONN->query("..." . $_GET[$KEY] . "...")
          - pattern: $CONN->query("..." . $_POST[$KEY] . "...")
          - pattern: $CONN->query("..." . $_REQUEST[$KEY] . "...")
    message: "SQL Injection via concatenação em PHP. Use prepared statements."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      fix: "Use prepared statements: $stmt = $conn->prepare($sql); $stmt->bind_param(...);"

  - id: php-hardcoded-password
    patterns:
      - pattern-either:
          - pattern: $db_password = "..."
          - pattern: $password = "..."
          - pattern: $db_pass = "..."
          - pattern: $secret = "..."
          - pattern: $api_key = "..."
          - pattern: $token = "..."
    message: "Credencial hardcoded em PHP. Use variáveis de ambiente."
    languages: [php]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      fix: "Use getenv('DB_PASSWORD') ou variáveis de ambiente."

  - id: php-die-connect-error
    pattern: die("..." . $CONN->connect_error)
    message: "Erro de conexão exposto ao usuário. Use mensagem genérica e logue internamente."
    languages: [php]
    severity: WARNING
    metadata:
      cwe: ["CWE-209"]
      fix: "Logue o erro e retorne mensagem genérica: die('Erro interno. Tente novamente.');"

  - id: php-direct-user-input
    patterns:
      - pattern-either:
          - pattern: $... = $_GET[$KEY]
          - pattern: $... = $_POST[$KEY]
          - pattern: $... = $_REQUEST[$KEY]
    message: "Input do usuário usado sem sanitização. Valide e sanitize antes de usar."
    languages: [php]
    severity: WARNING
    metadata:
      cwe: ["CWE-20"]
      fix: "Use filter_input(INPUT_GET, 'param', FILTER_SANITIZE_STRING) ou validação adequada."

  # ═══════════════════════════════════════════════════════════════════════════════
  # NoSQL INJECTION (MongoDB — TypeScript/JavaScript)
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: nosql-injection-findone
    patterns:
      - pattern-either:
          - pattern: |
