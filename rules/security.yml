          - pattern: $CMD.!!
      - pattern-not: Runtime.getRuntime().exec("...")
    message: "Command Injection em Scala."
    languages: [scala]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]

  - id: scala-weak-crypto
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("$ALG")
          - pattern: Cipher.getInstance("$ALG")
      - metavariable-regex:
          metavariable: $ALG
          regex: ^(MD5|SHA-1|SHA1|DES|DES/.*|AES/ECB/.*|RC4|Blowfish)$
    message: "Algoritmo criptográfico fraco. Use SHA-256+ ou AES/GCM."
    languages: [scala]
    severity: ERROR
    metadata:
      cwe: ["CWE-327"]

  - id: scala-hex-credential
    patterns:
      - pattern-either:
          - pattern: val $VAR = "$VAL"
          - pattern: var $VAR = "$VAL"
      - metavariable-regex:
          metavariable: $VAL
          regex: ^[0-9a-fA-F]{32,}$
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)^(?!.*(hash|checksum|sha256|sha512|md5|fingerprint|commit|digest)).*$
    message: "String hexadecimal longa (32+ chars) hardcoded — padrão de API key/license key."
    languages: [scala]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]

  # ═══════════════════════════════════════════════════════════════════════════════
  # TERRAFORM / IaC
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: tf-security-group-open
    patterns:
      - pattern-either:
          - pattern: |
              ingress { ... cidr_blocks = ["0.0.0.0/0"] ... }
          - pattern: |
              ingress { ... ipv6_cidr_blocks = ["::/0"] ... }
    message: "Security group aberto para todo o mundo (0.0.0.0/0). Restrinja o acesso."
    languages: [hcl, terraform]
    severity: ERROR
    metadata:
      cwe: ["CWE-284"]

  - id: tf-s3-public
    patterns:
      - pattern-either:
          - pattern: |
              acl = "public-read"
          - pattern: |
              acl = "public-read-write"
    message: "Bucket S3 com ACL pública. Use private e configure access points."
    languages: [hcl, terraform]
    severity: ERROR
    metadata:
      cwe: ["CWE-284"]

  - id: tf-unencrypted-storage
    patterns:
      - pattern-either:
          - pattern: |
              encrypted = false
          - pattern: |
              storage_encrypted = false
    message: "Storage sem criptografia. Habilite encryption at rest."
    languages: [hcl, terraform]
    severity: ERROR
    metadata:
      cwe: ["CWE-311"]

  - id: tf-wildcard-iam
    patterns:
      - pattern-either:
          - pattern: |
              actions = ["*"]
          - pattern: |
              resources = ["*"]
          - pattern: |
              "Action": "*"
          - pattern: |
              "Resource": "*"
    message: "IAM policy com wildcard (*). Aplique princípio de menor privilégio."
    languages: [hcl, terraform, json]
    severity: ERROR
    metadata:
      cwe: ["CWE-250"]

  - id: tf-hardcoded-secret
    patterns:
      - pattern-either:
          - pattern: $VAR = "$VAL"
      - metavariable-regex:
          metavariable: $VAL
          regex: ^(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|[0-9a-fA-F]{32,}|[A-Za-z0-9+/=_\-]{40,})$
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)^(?!.*(hash|checksum|sha|md5|fingerprint|commit|digest|description|name|tag|cidr|ami|region|zone|type)).*$
    message: "Possível credencial hardcoded em Terraform. Use variáveis ou secret manager."
    languages: [hcl, terraform]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]

  - id: tf-public-database
    patterns:
      - pattern-either:
          - pattern: |
              publicly_accessible = true
    message: "Database acessível publicamente. Mantenha em subnet privada."
    languages: [hcl, terraform]
    severity: ERROR
    metadata:
      cwe: ["CWE-284"]

  # ═══════════════════════════════════════════════════════════════════════════════
  # DOCKER
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: dockerfile-run-as-root
    patterns:
      - pattern-either:
          - pattern: USER root
    message: "Container rodando como root. Use um usuário não privilegiado."
    languages: [dockerfile]
    severity: WARNING
    metadata:
      cwe: ["CWE-250"]
      fix: "Adicione 'USER nonroot' ou 'USER 1000' no Dockerfile."

  # ═══════════════════════════════════════════════════════════════════════════════
  # YAML / JSON (config files)
  # ═══════════════════════════════════════════════════════════════════════════════

  - id: config-known-service-token
    patterns:
      - pattern: "$VAL"
      - metavariable-regex:
          metavariable: $VAL
          regex: ^(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|sk-[A-Za-z0-9_\-]{20,}|sk_live_[A-Za-z0-9]{20,}|sk_test_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|xox[baprs]-[A-Za-z0-9\-]{10,}|SG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}|AIza[A-Za-z0-9_\-]{35}|NRAK-[A-Za-z0-9]{27}|nri-[A-Za-z0-9]{20,})$
    message: "Token/API key com prefixo conhecido em arquivo de configuração. Use variáveis de ambiente."
    languages: [yaml, json]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]

  - id: config-hex-credential
    patterns:
      - pattern: "$VAL"
      - metavariable-regex:
          metavariable: $VAL
          regex: ^[0-9a-fA-F]{32,}$
    message: "String hexadecimal longa (32+ chars) em arquivo de configuração — possível credencial."
    languages: [yaml, json]
    severity: WARNING
    metadata:
      cwe: ["CWE-798"]
